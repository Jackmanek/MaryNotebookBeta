spring.application.name=maryNotebook
spring.datasource.url=jdbc:oracle:thin:@host.docker.internal:1521/xepdb1
spring.datasource.username=marynotebook
spring.datasource.password=marynotebook
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true

marynotebook.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB